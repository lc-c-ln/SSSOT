<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SR 접수</title>
<style>
:root{--bg:#f4f5f7;--s:#fff;--ink:#1b2430;--mut:#5d6877;--line:#d9dde4;--acc:#1f4fd8;--ok:#0f766e;--wait:#b45309;--bad:#a4262c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,"Malgun Gothic",sans-serif;padding:20px 16px 48px}
.w{max-width:1100px;margin:0 auto;display:grid;gap:16px}h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px}
.g{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}@media(max-width:820px){.g{grid-template-columns:minmax(0,1fr)}}
.c{background:var(--s);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}input,textarea,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical}button{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--s);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mut)}
tr.r{cursor:pointer}tr.r:hover,tr.sel{background:var(--bg)}.sc{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#e6ecfc;color:var(--acc)}.pill.ok{background:#dcf3ef;color:var(--ok)}.pill.wait{background:#fdf0dc;color:var(--wait)}
.m{color:var(--mut);font-size:12px}.err{color:var(--bad);font-weight:600}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 140px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12px;max-height:240px;overflow:auto;margin:4px 0 0}
details{margin:4px 0}.tabs{display:flex;gap:6px}.tabs button[aria-selected=true]{border-color:var(--acc);color:var(--acc);font-weight:600}.ok{color:var(--ok)}.cand{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0}.cand label{display:flex;gap:8px;align-items:center;margin:0;color:var(--ink);font-size:14px}.cand input{width:auto}.diff{font:12px/1.45 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:6px;overflow-x:auto;margin:6px 0}.diff div{padding:0 8px;white-space:pre}.diff .a{background:#e2f5e8;color:#0d6b3a}.diff .d{background:#fbe5e6;color:#a4262c}.diff .h{background:var(--bg);color:var(--mut)}summary{cursor:pointer}
</style></head><body><div class="w">
<div><h1>SR 접수</h1><div class="m" id="st">상태 확인 중…</div></div>
<div class="tabs"><button id="t1" aria-selected="true">요청</button><button id="t2" aria-selected="false">프로젝트 설정</button><button id="t3" aria-selected="false">문서 갱신</button></div>
<div class="g" id="p1">
 <form class="c" id="f"><h2>새 서비스 요청</h2>
  <label for="requester">요청자</label><input id="requester" required maxlength="100">
  <label for="project">대상 프로젝트</label><select id="project"><option value="">(지정 안 함)</option></select>
  <label for="title">제목</label><input id="title" required maxlength="200">
  <label for="body">요청 내용</label><textarea id="body" required maxlength="20000"></textarea>
  <p><button class="p" type="submit">요청 등록</button> <span id="fmsg" class="m"></span></p></form>
 <div class="c"><h2>요청 목록</h2><div class="sc"><table><thead><tr><th>번호</th><th>제목</th><th>상태</th><th>유형</th></tr></thead><tbody id="list"></tbody></table></div></div>
</div>
<div class="c" id="d" hidden></div>
<div id="p3" hidden class="w">
 <div class="c"><h2>문서 갱신 제안</h2><div class="m" id="hookst"></div>
  <div class="row"><div><label for="sp3">프로젝트</label><select id="sp3"></select></div><div><label for="sh3">커밋 해시 (비우면 기본 브랜치 최신)</label><input id="sh3" placeholder="예: a3f9c21"></div><div><label for="sa3">작업자</label><input id="sa3" maxlength="100"></div><div><button id="scan3">지금 스캔</button></div></div><div id="scanmsg" class="m"></div></div>
 <div id="dl"></div></div>
<div id="p2" hidden class="g">
 <form class="c" id="pf"><h2>프로젝트 등록 / 수정</h2>
  <label for="pn">이름 (SR의 대상 프로젝트로 선택됨)</label><input id="pn" required maxlength="100" placeholder="member-service">
  <label for="pl">로컬 소스 경로 (이미 clone 한 폴더)</label><input id="pl" required placeholder="D:\work\member-service">
  <label for="pg">GitLab 주소 (선택, MR 생성 단계에서 사용)</label><input id="pg" placeholder="https://gitlab.company.com/acme/member-service">
  <label for="pb">기본 브랜치</label><input id="pb" value="main">
  <label for="pt">GitLab 토큰이 들어 있는 환경변수 이름 (값이 아님)</label><input id="pt" placeholder="GITLAB_TOKEN_MEMBER">
  <label for="ps">DB 스키마 문서 경로 (선택)</label><input id="ps" placeholder="D:\docs\member-schema.xlsx">
  <label for="pdb">실제 Oracle 메타데이터 조회용 환경변수 접두어 (선택, 기본 꺼짐)</label><input id="pdb" placeholder="MEMBER → SSOT_DB_MEMBER_USER / _PASSWORD / _DSN 을 읽음">
  <label for="pd">갱신할 문서 경로 (줄바꿈으로 여러 개, 선택)</label><textarea id="pd" style="min-height:60px"></textarea>
  <label for="pa">작업자</label><input id="pa" maxlength="100">
  <p><button class="p" type="submit">저장 후 연결 확인</button> <span id="pmsg" class="m"></span></p></form>
 <div class="c"><h2>등록된 프로젝트</h2><div id="plist"></div></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={data_analyzing:['테이블 분석 중','wait'],data_ready:['SQL 안 확인 대기','wait'],data_error:['데이터 분석 오류','wait'],data_done:['처리 완료(담당자 보고)','ok'],patch_generating:['수정안 생성 중','wait'],patch_ready:['수정안 승인 대기','wait'],patch_failed:['수정안 생성 실패','wait'],rejected:['반려','wait'],committed:['브랜치 커밋됨','ok'],mr_created:['MR 생성됨','ok'],analyzing:['영향 분석 중','wait'],impact_ready:['대상 파일 선택 대기','wait'],impact_error:['영향 분석 오류','wait'],impact_confirmed:['대상 파일 확정','ok'],received:['접수','' ],classifying:['분류 중','wait'],classified:['분류 완료','ok'],needs_review:['담당자 확인 필요','wait'],pending_llm:['AI 응답 대기(재시도 필요)','wait']};
const TY={code:'소스 수정',data:'데이터 수정',unknown:'판단 불가','':'-'};
let cur=null,PROJECTS=[],DATA=null;
const show2=t=>{$('p1').hidden=t!==1;$('p2').hidden=t!==2;$('p3').hidden=t!==3;$('t3').setAttribute('aria-selected',t===3);if(t!==1)$('d').hidden=true;else if(cur)$('d').hidden=false;$('t1').setAttribute('aria-selected',t===1);$('t2').setAttribute('aria-selected',t===2)};
$('t1').onclick=()=>show2(1);$('t2').onclick=()=>{show2(2);loadProjects()};
$('t3').onclick=async()=>{show2(3);await loadProjects();$('sp3').innerHTML=PROJECTS.map(p=>`<option>${E(p.name)}</option>`).join('');loadDocs()};
const AL={update:'수정',fill:'채움',add:'추가',narrative:'본문 수정',missing:'소스에 없음',review:'확인 필요'};
async function loadDocs(){const r=await api('/api/docs');
 $('hookst').innerHTML=r.webhook_ready?'GitLab 웹훅 수신 가능 (POST /api/hooks/gitlab, X-Gitlab-Token 필요)':'웹훅 비활성: 서버 실행 전에 환경변수 <b>SSOT_WEBHOOK_SECRET</b> 을 설정하세요. 웹훅 없이도 아래 "지금 스캔"으로 사용할 수 있습니다.';
 $('dl').innerHTML=r.items.map(d=>{const pend=d.status==='pending';return `<div class="c" style="margin-top:12px"><h2>${E(d.doc_path.split(/[\\/]/).pop())} <span class="pill ${pend?'wait':'ok'}">${{pending:'승인 대기',applied:'적용됨',dismissed:'보류'}[d.status]||E(d.status)}</span></h2>
 <div class="m">${E(d.project)} · 커밋 ${E(d.commit_sha.slice(0,8))} · ${E(d.summary)}${d.sr_ids.length?' · SR '+d.sr_ids.map(i=>'SR-'+String(i).padStart(4,'0')).join(', '):''}${d.output?' · 저장: '+E(d.output):''}</div>
 <div class="sc"><table><thead><tr>${pend?'<th></th>':''}<th>구분</th><th>위치/대상</th><th>이전</th><th>이후</th></tr></thead><tbody>${d.changes.map(c=>`<tr>${pend?`<td>${c.applicable&&c.action!=='narrative'?`<input type="checkbox" class="dc" data-p="${d.id}" value="${c.id}" checked>`:c.applicable?`<input type="checkbox" class="dc" data-p="${d.id}" value="${c.id}">`:''}</td>`:''}<td>${AL[c.action]||E(c.action)}</td><td>${E(c.where)}<br><b>${E(c.key)}</b> ${E(c.field)}</td><td class="err">${E(c.old)}</td><td class="ok">${E(c.new)}</td></tr>`).join('')}</tbody></table></div>
 ${pend?`<div class="row"><div><label for="da${d.id}">승인자</label><input id="da${d.id}" maxlength="100"></div><div><label for="dr${d.id}">보류 사유(보류 시)</label><input id="dr${d.id}" maxlength="200"></div><div><button class="p" data-apply="${d.id}">선택 항목 적용 (새 파일로 저장)</button> <button data-dis="${d.id}">보류</button></div></div><div class="err" id="de${d.id}"></div>`:''}</div>`}).join('')||'<p class="m">아직 제안이 없습니다.</p>'}
$('dl').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.apply||b.dataset.dis;if(!id)return;
 try{if(b.dataset.apply)await post(`/api/docs/${id}/apply`,{actor:$('da'+id).value,accepted:[...document.querySelectorAll(`.dc[data-p="${id}"]:checked`)].map(x=>+x.value)});
  else await post(`/api/docs/${id}/dismiss`,{actor:$('da'+id).value,reason:$('dr'+id).value});await loadDocs()}catch(x){$('de'+id).textContent=x.message}};
$('scan3').onclick=async()=>{$('scanmsg').textContent='스캔 중… (AI 사용 시 수 분 걸릴 수 있습니다)';try{const r=await post('/api/docs/scan',{project:$('sp3').value,sha:$('sh3').value,actor:$('sa3').value});$('scanmsg').textContent=`제안 ${r.created}건 생성. ${r.note||''}`;loadDocs()}catch(x){$('scanmsg').innerHTML='<span class="err">'+E(x.message)+'</span>'}};
async function loadProjects(){const {items}=await api('/api/projects');PROJECTS=items;
 const cur=$('project').value;$('project').innerHTML='<option value="">(지정 안 함)</option>'+items.map(p=>`<option>${E(p.name)}</option>`).join('');$('project').value=cur;
 $('plist').innerHTML=items.map(p=>`<div class="cand"><b>${E(p.name)}</b> <span class="m">${E(p.default_branch)}</span><div class="m mono">${E(p.local_path)}</div><div class="m">${E(p.gitlab_url||'GitLab 미지정')} · 토큰: ${E(p.token_env||'미지정')}</div><div class="row"><div><button data-chk="${E(p.name)}">연결 확인</button> <button data-edit="${E(p.name)}">수정</button> <button data-del="${E(p.name)}">삭제</button></div></div><div class="m" id="chk-${E(p.name)}"></div></div>`).join('')||'<p class="m">등록된 프로젝트가 없습니다. 왼쪽에서 등록하세요.</p>'}
function chkText(c){const y=(b,t)=>`<span class="${b?'ok':'err'}">${b?'✓':'✗'} ${t}</span>`;return [y(c.path_exists,'소스 폴더'),y(c.java_files>0,'Java 파일 '+c.java_files+'개'),y(c.git_repo,'Git 저장소'),y(c.branch_exists,'기본 브랜치'),y(c.token_set,'토큰 환경변수'),y(c.schema_doc_exists,'스키마 문서'),y(c.db_configured,'DB 접속 설정(선택)')].join(' · ')}
$('plist').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.chk){$('chk-'+b.dataset.chk).innerHTML=chkText(await api('/api/projects/check?name='+encodeURIComponent(b.dataset.chk)))}
 if(b.dataset.edit){const p=PROJECTS.find(x=>x.name===b.dataset.edit);$('pn').value=p.name;$('pl').value=p.local_path;$('pg').value=p.gitlab_url;$('pb').value=p.default_branch;$('pt').value=p.token_env;$('ps').value=p.schema_doc;$('pdb').value=p.db_env_prefix||'';$('pd').value=p.doc_paths.join('\n')}
 if(b.dataset.del&&confirm('삭제할까요? (SR 기록은 유지됩니다)'))await post('/api/projects/delete',{name:b.dataset.del,actor:$('pa').value}).then(loadProjects)};
$('pf').onsubmit=async e=>{e.preventDefault();try{const r=await post('/api/projects',{actor:$('pa').value,name:$('pn').value,local_path:$('pl').value,gitlab_url:$('pg').value,default_branch:$('pb').value,token_env:$('pt').value,schema_doc:$('ps').value,db_env_prefix:$('pdb').value,doc_paths:$('pd').value});
 $('pmsg').innerHTML=chkText(r.check);await loadProjects()}catch(x){$('pmsg').innerHTML='<span class="err">'+E(x.message)+'</span>'}};
async function api(p,o){const r=await fetch(p,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
const post=(p,b)=>api(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
function diffHtml(t){return '<div class="diff">'+t.split('\n').map(l=>`<div class="${l.startsWith('+++')||l.startsWith('---')||l.startsWith('@@')?'h':l[0]==='+'?'a':l[0]==='-'?'d':''}">${E(l)||' '}</div>`).join('')+'</div>'}
function patchHtml(sr,patches,selfOk){
 if(!patches||!patches.length)return sr.status==='patch_generating'?'<p class="m">수정안 생성 중… (모델 속도에 따라 수 분 걸릴 수 있습니다)</p>':'';
 const p=patches[patches.length-1];let h=`<h2 style="margin-top:14px">수정안 v${p.version} <span class="pill ${p.status==='proposed'?'wait':p.status==='failed'||p.status==='rejected'?'wait':'ok'}">${{generating:'생성 중',proposed:'승인 대기',failed:'생성 실패',superseded:'수정 요구됨',rejected:'반려됨',committed:'브랜치 커밋됨',published:'MR 생성됨'}[p.status]||E(p.status)}</span></h2>`;
 if(p.status==='generating')return h+'<p class="m">생성 중…</p>';
 if(p.error)h+=`<p class="err">${E(p.error)}</p>`;
 if(p.explanation)h+=`<p><b>수정 이유</b> ${E(p.explanation)}</p>`;
 if(p.warnings.length)h+=`<div class="cand"><b>확인 필요</b><ul>${p.warnings.map(w=>'<li>'+E(w)+'</li>').join('')}</ul></div>`;
 if(p.diff)h+=`<div class="m">${p.stats.files.map(E).join(', ')} · +${p.stats.additions} −${p.stats.deletions}</div>${diffHtml(p.diff)}`;
 if(p.status==='proposed'){h+=`<div class="row"><div><label for="pnote">코멘트 (수정 요구/반려 시 필수)</label><input id="pnote" maxlength="500"></div></div><div class="btns"><button class="p" id="pok">승인</button> <button id="prev">수정 요구</button> <button id="prej">반려</button></div>${selfOk?'':'<p class="m">요청자 본인은 승인할 수 없습니다.</p>'}`}
 if(p.status==='failed'||sr.status==='patch_failed')h+=`<div class="row"><div><label for="pnote">피드백(선택)</label><input id="pnote" maxlength="500"></div><div><button id="pgen">수정안 다시 생성</button></div></div>`;
 if(p.status==='committed'||p.status==='published'){h+=`<p>브랜치 <b class="mono">${E(p.branch)}</b> · 커밋 <span class="mono">${E(p.commit_sha.slice(0,8))}</span> · 승인 ${E(p.decided_by)}</p>`;
  h+=p.mr_url?`<p>Merge Request: <a href="${E(p.mr_url)}" target="_blank" rel="noopener">${E(p.mr_url)}</a></p>`:`<p class="m">${E(sr.reason)}</p><button id="ppub">GitLab에 push 후 MR 생성</button>`}
 return h}
function dataHtml(sr,d){
 const opts=PROJECTS.map(p=>`<option ${p.name===sr.project?'selected':''}>${E(p.name)}</option>`).join('');
 let h=`<div class="row"><div><label for="sp">대상 프로젝트 (DB 스키마가 등록된)</label><select id="sp"><option value="">(선택)</option>${opts}</select></div><div><button id="sproj">프로젝트 지정</button> <button id="dana">테이블 분석 / SQL 안 생성</button></div></div>`;
 if(sr.status==='data_analyzing')return h+'<p class="m">테이블 분석 중…</p>';
 if(!d)return h;
 h+=`<h2 style="margin-top:12px">관련 테이블 <span class="m">스키마: ${E(d.schema_source)}</span></h2>`;
 h+=d.tables.map(t=>`<div class="cand"><b class="mono">${E(t.name)}</b> ${E(t.comment)} <span class="pill ${t.by==='ai'?'':'wait'}">${t.by==='ai'?'AI 선정':'검색 점수(AI 실패)'}</span><div class="m">${E(t.reason)}</div><div class="sc"><table><thead><tr><th>컬럼</th><th>타입</th><th>설명</th></tr></thead><tbody>${t.columns_info.map(c=>`<tr style="${t.columns.includes(c.name)?'font-weight:600':''}"><td class="mono">${E(c.name)}${c.pk?' 🔑':''}</td><td class="mono">${E(c.type)}</td><td>${E(c.comment)}</td></tr>`).join('')}</tbody></table></div></div>`).join('');
 if(d.related.length)h+=`<h2 style="margin-top:12px">영향 범위 (연관 테이블)</h2>`+d.related.map(r=>`<div class="cand"><b class="mono">${E(r.table)}</b><div class="m">${r.via.map(E).join('<br>')}</div></div>`).join('');
 if(d.diffs.length)h+=`<details><summary class="err">스키마 문서와 DB 불일치 ${d.diffs.length}건</summary><pre>${E(d.diffs.join('\n'))}</pre></details>`;
 h+=`<div class="cand" style="border-color:var(--wait);background:#fdf0dc;color:#7a3b00"><b>자동 실행되지 않습니다.</b> 아래 SQL 은 담당자가 확인한 뒤 직접 실행하세요. COMMIT 은 영향 건수를 확인한 뒤에 하세요.</div>`;
 h+=d.statements.map((x,i)=>x.blocked?`<details open><summary class="err">차단됨: ${E(x.title)}</summary><ul>${x.warnings.map(w=>'<li>'+E(w)+'</li>').join('')}</ul><pre>${E(x.sql)}</pre></details>`:`<div style="margin-top:8px"><div class="row" style="align-items:center"><b>${E(x.title)}</b><span style="flex:0 0 auto"><button data-copy="${i}">복사</button></span></div><pre id="sql${i}" style="max-height:none">${E(x.sql)}</pre>${x.warnings.map(w=>`<div class="err">⚠ ${E(w)}</div>`).join('')}</div>`).join('');
 h+=`<ul class="m">${d.notes.map(n=>'<li>'+E(n)+'</li>').join('')}</ul>`;
 if(sr.status==='data_ready')h+=`<div class="row"><div><label for="daff">처리 건수 (실행 후)</label><input id="daff" inputmode="numeric"></div><div><label for="dnote">메모</label><input id="dnote" maxlength="300"></div><div><button class="p" id="drep">실행 완료로 기록</button></div></div><p class="m">시스템은 실행 결과를 알 수 없어 "담당자 보고"로 기록됩니다.</p>`;
 return h}
function impactHtml(sr,imp){
 if(sr.sr_type==='data'&&!['classifying','received','pending_llm'].includes(sr.status))return dataHtml(sr,DATA);
 if(sr.sr_type!=='code'||['classifying','received','pending_llm'].includes(sr.status))return '';
 const opts=PROJECTS.map(p=>`<option ${p.name===sr.project?'selected':''}>${E(p.name)}</option>`).join('');
 let h=`<div class="row"><div><label for="sp">대상 프로젝트</label><select id="sp"><option value="">(선택)</option>${opts}</select></div><div><button id="sproj">프로젝트 지정</button> <button id="sana">영향 분석 실행</button></div></div>`;
 if(sr.status==='analyzing')return h+'<p class="m">영향 분석 중…</p>';
 if(!imp)return h;
 h+=`<h2 style="margin-top:12px">수정 대상 후보 ${imp.vector_used?'':'<span class="m">(키워드 검색만 사용)</span>'}</h2><div class="m">AI 검색어: ${imp.keywords.map(E).join(', ')||'-'}</div>`;
 h+=imp.candidates.map(c=>`<div class="cand"><label><input type="checkbox" class="cf" value="${E(c.file)}" ${imp.selected.includes(c.file)?'checked':''}> <b class="mono">${E(c.file)}</b> <span class="pill">점수 ${c.score}</span></label><div class="m">근거: ${E(c.reason)} · ${c.chunks.map(k=>E((k.method||'(클래스)')+':'+k.line)).join(', ')}</div></div>`).join('')||'<p class="m">후보를 찾지 못했습니다. 파일을 직접 추가하세요.</p>';
 h+=`<div class="row"><div><label for="xf">파일 직접 추가 (프로젝트 기준 상대경로)</label><input id="xf" placeholder="src/main/java/..."></div><div><button id="xadd">추가</button> <button class="p" id="xok">이 파일들로 확정</button></div></div>`;
 return h}
const pill=s=>{const [t,k]=ST[s]||[s,''];return `<span class="pill ${k}">${E(t)}</span>`};
async function status(){try{const s=await api('/api/status');const o=s.ollama;
 $('st').innerHTML=(o.ok?`Ollama 연결됨 · 모델 ${E(o.model)} ${o.model_ready?'':'<span class="err">(미설치: ollama pull)</span>'}`:`<span class="err">Ollama 연결 안 됨</span> (${E(o.error||'')})`)+` · 감사 로그 ${s.audit.ok?'무결성 정상 ('+s.audit.count+'건)':'<span class="err">변조 의심: #'+s.audit.broken_at+'</span>'}`}catch(e){$('st').textContent=e.message}}
async function list(){const {items}=await api('/api/sr');
 $('list').innerHTML=items.map(r=>`<tr class="r ${cur===r.id?'sel':''}" data-id="${r.id}"><td>SR-${String(r.id).padStart(4,'0')}</td><td>${E(r.title)}<div class="m">${E(r.requester)}</div></td><td>${pill(r.status)}</td><td>${TY[r.sr_type]||'-'}</td></tr>`).join('')||'<tr><td colspan="4" class="m">아직 요청이 없습니다.</td></tr>'}
async function show(id){cur=id;const {sr,audit,impact,patches,self_approve,data}=await api('/api/sr/'+id);DATA=data;const d=$('d');d.hidden=false;
 const need=sr.status==='needs_review',pend=sr.status==='pending_llm';
 d.innerHTML=`<h2>SR-${String(sr.id).padStart(4,'0')} ${E(sr.title)} ${pill(sr.status)}</h2>
 <div class="m">${E(sr.requester)} · ${E(sr.project||'-')} · ${E(sr.created_at)}</div><pre>${E(sr.body)}</pre>
 <p>자동 분류: <b>${TY[sr.sr_type]||'-'}</b>${sr.confidence!=null?` (신뢰도 ${Number(sr.confidence).toFixed(2)})`:''} <span class="m">${E(sr.reason)}</span></p>
 <p class="m">대상 프로젝트: <b>${E(sr.project||'-')}</b>${sr.reason&&/영향|프로젝트|경로/.test(sr.reason)?' · '+E(sr.reason):''}</p>
 ${impactHtml(sr,impact)}
 ${patchHtml(sr,patches,self_approve)}
 ${['classifying','received','analyzing','patch_generating'].includes(sr.status)?'':`<div class="row"><div><label for="actor">담당자</label><input id="actor" maxlength="100"></div>
 <div><label for="mt">유형 지정/변경</label><select id="mt"><option value="code">소스 수정</option><option value="data">데이터 수정</option></select></div>
 <div><label for="mn">사유(선택)</label><input id="mn" maxlength="200"></div><div><button id="mset">분류 저장</button> ${(need||pend)?'<button id="mretry">AI 재분류</button>':''}</div></div><div id="dm" class="err"></div>`}
 <h2 style="margin-top:14px">처리 이력 <a class="m" href="/api/sr/${sr.id}/audit.csv">CSV</a></h2>
 ${audit.map(a=>`<details><summary>${E(a.ts.replace('T',' ').slice(0,19))} · ${E(a.actor)} · <b>${E(a.event)}</b></summary><pre>${E(JSON.stringify(a.detail,null,2))}</pre></details>`).join('')}`;
 const f=(fn)=>async()=>{try{await fn();await show(id);await list()}catch(e){$('dm').textContent=e.message}};
  if($('sproj'))$('sproj').onclick=f(()=>post(`/api/sr/${id}/project`,{actor:$('actor')?.value||'',project:$('sp').value}));
 if($('sana'))$('sana').onclick=f(()=>post(`/api/sr/${id}/analyze`,{actor:$('actor')?.value||''}));
 if($('xadd'))$('xadd').onclick=()=>{const v=$('xf').value.trim();if(!v)return;const l=document.createElement('div');l.className='cand';l.innerHTML=`<label><input type="checkbox" class="cf" value="${E(v)}" checked> <b class="mono">${E(v)}</b> <span class="pill">직접 추가</span></label>`;$('xadd').closest('.row').before(l);$('xf').value=''};
 if($('xok'))$('xok').onclick=f(()=>post(`/api/sr/${id}/impact`,{actor:$('actor')?.value||'',files:[...document.querySelectorAll('.cf:checked')].map(x=>x.value)}));
 const act=()=>$('actor')?.value||'';
 if($('dana'))$('dana').onclick=f(()=>post(`/api/sr/${id}/data/analyze`,{actor:act()}));
 if($('drep'))$('drep').onclick=f(()=>post(`/api/sr/${id}/data/report`,{actor:act(),affected:$('daff').value,note:$('dnote').value}));
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const t=$('sql'+b.dataset.copy).textContent;try{await navigator.clipboard.writeText(t);b.textContent='복사됨'}catch(_){const r=document.createRange();r.selectNodeContents($('sql'+b.dataset.copy));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent='선택됨(Ctrl+C)'}});
 const dec=d=>f(()=>post(`/api/sr/${id}/patch/decide`,{actor:act(),patch_id:patches[patches.length-1].id,decision:d,note:$('pnote')?.value||''}));
 if($('pok'))$('pok').onclick=dec('approve');if($('prev'))$('prev').onclick=dec('revise');if($('prej'))$('prej').onclick=dec('reject');
 if($('pgen'))$('pgen').onclick=f(()=>post(`/api/sr/${id}/patch/generate`,{actor:act(),feedback:$('pnote')?.value||''}));
 if($('ppub'))$('ppub').onclick=f(()=>post(`/api/sr/${id}/patch/publish`,{actor:act()}));
 if($('mset'))$('mset').onclick=f(()=>post(`/api/sr/${id}/classify`,{actor:$('actor').value,type:$('mt').value,note:$('mn').value}));
 if($('mretry'))$('mretry').onclick=f(()=>post(`/api/sr/${id}/retry`,{actor:$('actor').value||'unknown'}));
 list()}
$('list').onclick=e=>{const t=e.target.closest('tr.r');if(t)show(+t.dataset.id)};
$('f').onsubmit=async e=>{e.preventDefault();$('fmsg').textContent='';try{
 const r=await post('/api/sr',{requester:$('requester').value,project:$('project').value,title:$('title').value,body:$('body').value});
 $('title').value='';$('body').value='';$('fmsg').textContent='등록되었습니다. AI가 분류하는 중…';await list();show(r.id)}catch(x){$('fmsg').innerHTML='<span class="err">'+E(x.message)+'</span>'}};
setInterval(()=>{list();status();if(cur&&/분류 중|영향 분석 중|수정안 생성 중|생성 중|테이블 분석 중/.test($('d').textContent)&&document.activeElement.tagName!=='INPUT')show(cur)},4000);
status();list();loadProjects();
</script></body></html>
